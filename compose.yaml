services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: REDACTED
      MYSQL_DATABASE: training_db
      MYSQL_USER: traininguser
      MYSQL_PASSWORD: REDACTED
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://db:3306/training_db
      DB_USERNAME: traininguser
      DB_PASSWORD: REDACTED
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
